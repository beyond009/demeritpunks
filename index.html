  <svg class="searchlights" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="beam-haze" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="beam-body" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="beam-inner" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
      <linearGradient id="beam-amber" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1400" y2="0">
        <stop stop-color="#ffe6a0" stop-opacity="1"/>
        <stop offset=".18" stop-color="#ffba4c" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#f58d28" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ad4a13" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g class="beam" data-eye="left">
      <path class="beam-halo" fill="url(#beam-amber)" filter="url(#beam-haze)"/>
      <path class="beam-body" fill="url(#beam-amber)" filter="url(#beam-body)"/>
      <path class="beam-inner" fill="url(#beam-amber)" filter="url(#beam-inner)"/>
      <path class="beam-shaft" fill="url(#beam-amber)" filter="url(#beam-inner)"/>
    </g>
    <g class="beam" data-eye="right">
      <path class="beam-halo" fill="url(#beam-amber)" filter="url(#beam-haze)"/>
      <path class="beam-body" fill="url(#beam-amber)" filter="url(#beam-body)"/>
      <path class="beam-inner" fill="url(#beam-amber)" filter="url(#beam-inner)"/>
      <path class="beam-shaft" fill="url(#beam-amber)" filter="url(#beam-inner)"/>
    </g>
  </svg>
  <svg class="eye-lights" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="ember">
        <stop stop-color="#ffe0a0" stop-opacity=".9"/>
        <stop offset=".12" stop-color="#ffc46a" stop-opacity=".7"/>
        <stop offset=".3" stop-color="#f3a33f" stop-opacity=".3"/>
        <stop offset="1" stop-color="#e77c22" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle data-glow="left" r="19" fill="url(#ember)"/>
    <circle data-glow="right" r="21" fill="url(#ember)"/>
  </svg>
